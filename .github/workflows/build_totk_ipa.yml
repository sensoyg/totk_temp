name: Build Zelda TotK IPA

on:
  workflow_dispatch:
    inputs:
      base_gdrive_id:
        description: 'Base Game (.xci veya .nsp) Google Drive Link veya ID'
        required: true
        type: string
      update_gdrive_id:
        description: 'Update (.nsp) Google Drive Link veya ID'
        required: true
        type: string
      keys_gdrive_id:
        description: 'prod.keys Google Drive Link veya ID'
        required: true
        type: string
      language:
        description: 'Game Language (e.g. en-US, ja, fr, de, es)'
        required: false
        default: 'en-US'
        type: string

permissions:
  contents: write

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: 1. Disk Alanı Aç (Mevcut Xcode Korunur, ~74 GB Boş Alan)
        run: |
          echo "=== Mevcut Xcode Sürümleri ==="
          ls -d /Applications/Xcode*.app || true
          
          # nxnative iOS 26 Metal 4 ve apple-a18 mimarisi için Xcode 26+ sürümünü seç
          RAW_XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | grep -v -i "beta" | sort -V | tail -n 1)
          if [ -z "$RAW_XCODE" ]; then
            RAW_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i "beta" | sort -V | tail -n 1)
          fi
          if [ -z "$RAW_XCODE" ]; then
            RAW_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          
          # Symlink ise asıl hedef dizini bul (örneğin Xcode_26.3.0.app -> Xcode_26.3.app)
          TARGET_XCODE=$(python3 -c "import os, sys; print(os.path.realpath(sys.argv[1]))" "$RAW_XCODE")
          
          echo "Seçilen ve Korunan Tam Xcode: $TARGET_XCODE (Kaynak: $RAW_XCODE)"
          sudo xcode-select -s "$TARGET_XCODE/Contents/Developer"
          export DEVELOPER_DIR="$TARGET_XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          
          # Diğer tüm Xcode sürümlerini silerek ~74 GB yer aç (asıl Xcode veya ona işaret eden linkler korunur)
          for x in /Applications/Xcode*.app; do
            REAL_X=$(python3 -c "import os, sys; print(os.path.realpath(sys.argv[1]))" "$x" 2>/dev/null || echo "$x")
            if [ "$REAL_X" != "$TARGET_XCODE" ] && [ "$x" != "$TARGET_XCODE" ]; then
              echo "Eski Xcode siliniyor: $x"
              sudo rm -rf "$x" || true
            fi
          done
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes || true
          sudo rm -rf /Users/runner/.dotnet || true
          sudo rm -rf /usr/local/share/dotnet || true
          brew cleanup -s || true
          df -h

      - name: 2. nxnative Kaynak Kodunu İndir, Bağımlılıkları Kur ve 15 Sn iOS Ön Testi Yap
        run: |
          git clone https://github.com/seedds/nxnative.git
          
          brew install xcodegen zstd spirv-cross glslang lz4 p7zip
          
          if ! dotnet --list-sdks 2>/dev/null | grep -q "^10\."; then
            brew install --cask dotnet-sdk || brew upgrade --cask dotnet-sdk
          fi
          
          # brew install sonrasında xcode-select sıfırlanmasına karşı tam Xcode'u tekrar sabitle
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || xcodebuild -downloadComponent metalToolchain || true
          fi
          
          python3 -m pip install --break-system-packages gdown capstone fonttools nsz "backports.zstd; python_version < '3.14'"
          PYLZ4_USE_SYSTEM_LZ4=0 python3 -m pip install --break-system-packages --force-reinstall --no-binary lz4 lz4
          
          # macos-15 Xcode 16 SDK'sı için Launcher.swift glassProminent -> borderedProminent yaması
          if ! xcodebuild -version | grep -E "Xcode (2[6-9]|[3-9][0-9])" >/dev/null 2>&1; then
            echo "Xcode 16 algılandı, Launcher.swift glassProminent -> borderedProminent uyumluluk yaması uygulanıyor..."
            sed -i '' 's/\.glassProminent/.borderedProminent/g' nxnative/dm/ios/Sources/Launcher.swift
            sed -i '' 's/\.glass\b/.bordered/g' nxnative/dm/ios/Sources/Launcher.swift || true
          fi
          
          echo "=== iOS Xcode Derlemesi ÖN TESTİ (Oyun İndirilmeden Önce 15 Saniyede Kontrol) ==="
          GAME=010015100B514000 python3 nxnative/dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke"
          rm -rf "$RUNNER_TEMP/ios-smoke"
          echo "✓ iOS Xcode derleme ön testi BAŞARILI! Artık güvenle derlemeye geçilebilir."

      - name: 3. Önbellek (Cache) Kontrolü — Varsa Önceki Shader ve Modülleri Geri Yükle
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Users/runner/work/_temp/Games/TotK/0100F2C0115B6000_build/patched_*
            /Users/runner/work/_temp/Games/TotK/0100F2C0115B6000_build/shader
            /Users/runner/work/_temp/Games/TotK/0100F2C0115B6000_build/font
            nxnative/dm/games/0100F2C0115B6000/c1_full.tsv
            nxnative/dm/games/0100F2C0115B6000/cb_extent.tsv
          key: totk-shaders-v2-${{ inputs.base_gdrive_id }}-${{ inputs.update_gdrive_id }}
          restore-keys: |
            totk-shaders-v2-

      - name: 4. Oyun Dosyalarını (.xci + .nsp) ve prod.keys Dosyasını Google Drive'dan İndir
        env:
          IN_KEYS: ${{ inputs.keys_gdrive_id }}
          IN_BASE: ${{ inputs.base_gdrive_id }}
          IN_UPD: ${{ inputs.update_gdrive_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/Games/TotK"
          mkdir -p "$RUNNER_TEMP/keys"
          
          python3 - << 'EOF'
          import os, re, sys, zipfile
          import gdown

          def extract_id(val):
              val = val.strip()
              m = re.search(r'/d/([a-zA-Z0-9_-]{15,})', val)
              if m:
                  return m.group(1)
              m = re.search(r'[?&]id=([a-zA-Z0-9_-]{15,})', val)
              if m:
                  return m.group(1)
              return val

          def smart_download(raw_input, out_path, min_bytes, label):
              fid = extract_id(raw_input)
              print(f"=== {label} indiriliyor (ID: {fid}) ===", flush=True)
              try:
                  res = gdown.download(id=fid, output=out_path, quiet=False, fuzzy=True)
              except TypeError:
                  url = f"https://drive.google.com/uc?id={fid}"
                  res = gdown.download(url=url, output=out_path, quiet=False)
              if not res or not os.path.exists(out_path):
                  sys.exit(f"HATA: {label} indirilemedi! Lütfen Google Drive paylaşım izninin 'Bağlantıya sahip olan herkes' olduğundan emin olun.")
              sz = os.path.getsize(out_path)
              print(f"{label} indirildi: {sz / (1024*1024):.2f} MB", flush=True)
              if sz < min_bytes:
                  sys.exit(f"HATA: {label} boyutu beklenenden çok küçük ({sz} byte)! Google Drive günlük indirme kotası dolmuş olabilir.")

          temp_dir = os.environ["RUNNER_TEMP"]
          keys_out = os.path.join(temp_dir, "keys", "prod.keys")
          smart_download(os.environ["IN_KEYS"], keys_out, 500, "prod.keys")

          if zipfile.is_zipfile(keys_out):
              with zipfile.ZipFile(keys_out, 'r') as z:
                  for name in z.namelist():
                      if name.endswith(".keys") or "prod" in name.lower():
                          with open(keys_out, "wb") as f:
                              f.write(z.read(name))
                          break

          upd_ver = "v720896"
          game_tsv = "nxnative/dm/games/0100F2C0115B6000/game.tsv"
          if os.path.exists(game_tsv):
              with open(game_tsv, "r", encoding="utf-8") as f:
                  for line in f:
                      m = re.search(r'\b(v[1-9][0-9]*)\b', line)
                      if m:
                          upd_ver = m.group(1)
          print(f"Algılanan hedef Update sürüm etiketi: {upd_ver}", flush=True)

          base_out = os.path.join(temp_dir, "Games", "TotK", "Tears of the Kingdom [0100F2C0115B6000][v0].xci")
          upd_out = os.path.join(temp_dir, "Games", "TotK", f"Tears of the Kingdom [0100F2C0115B6800][{upd_ver}].nsp")

          smart_download(os.environ["IN_BASE"], base_out, 100 * 1024 * 1024, "Base Game (.xci / .nsp)")
          smart_download(os.environ["IN_UPD"], upd_out, 10 * 1024 * 1024, "Update (.nsp)")

          # Base game dosyasının tipini (NSP vs XCI) kontrol et ve gerekirse uzantıyı güncelle
          with open(base_out, 'rb') as bf:
              magic4 = bf.read(4)
          if magic4 == b'PFS0':
              nsp_base_out = base_out[:-4] + '.nsp'
              os.rename(base_out, nsp_base_out)
              print("Base game PFS0 (NSP) formatında tespit edildi, dosya adı .nsp olarak güncellendi.", flush=True)
          EOF

      - name: 5. Derlemeyi Çalıştır (ve Shader Çıktılarını Önbelleğe Hazırla)
        id: build-step
        working-directory: nxnative
        run: |
          set -e
          sudo xcode-select -s "$DEVELOPER_DIR"
          G=0100F2C0115B6000
          NSP_DIR="$RUNNER_TEMP/Games/TotK"
          KEYS="$RUNNER_TEMP/keys/prod.keys"
          OUT_IPA="$RUNNER_TEMP/out/TotK.ipa"
          mkdir -p "$RUNNER_TEMP/out"
          
          # Arka plan disk koruyucusu: ekstraksiyon biter bitmez .xci ve .nsp dosyalarını siler (~18 GB kazanç)
          # Önbellekten gelen shader/ veya patched_* klasörlerinden etkilenmez, gerçek ekstraksiyonun bitmesini bekler
          (
            while true; do
              if [ -d "$NSP_DIR/${G}_build/extract" ] && ! ls -d "$NSP_DIR/${G}_build/extract"/*.partial >/dev/null 2>&1; then
                if ls "$NSP_DIR"/*[vV][1-9]*.nsp >/dev/null 2>&1; then
                  if ls "$NSP_DIR/${G}_build/extract"/v[1-9]*/ExeFS/main >/dev/null 2>&1; then
                    echo "[Disk Koruyucu] Base ve Update ekstraksiyonu tamamlandı! Kaynak .xci ve .nsp dosyaları siliniyor..."
                    rm -f "$NSP_DIR"/*.xci "$NSP_DIR"/*.nsp
                    break
                  fi
                elif ls "$NSP_DIR/${G}_build/extract"/v0/ExeFS/main >/dev/null 2>&1; then
                  echo "[Disk Koruyucu] Base ekstraksiyonu tamamlandı! Kaynak .xci dosyası siliniyor..."
                  rm -f "$NSP_DIR"/*.xci "$NSP_DIR"/*.nsp
                  break
                fi
              fi
              sleep 5
            done
          ) &
          WATCHER_PID=$!
          
          # Xcode paketlemesine geçildiğinde v0 RomFS fazlalığını ve cas önbelleğini temizle
          (
            while true; do
              if ls -d "$NSP_DIR/${G}_build"/ipa/build* >/dev/null 2>&1; then
                echo "[Disk Koruyucu] Shader aşaması bitti, Xcode IPA paketlemesine geçildi! v0 RomFS siliniyor..."
                rm -rf "$NSP_DIR/${G}_build/extract/v0" || true
                rm -rf "$NSP_DIR/${G}_build/shader/cache/cas" || true
                break
              fi
              sleep 5
            done
          ) &
          WATCHER2_PID=$!
          
          python3 scripts/build_ipa_from_nsp.py "$NSP_DIR" \
            -k "$KEYS" \
            -o "$OUT_IPA" \
            -l "${{ inputs.language }}" \
            --show-fps \
            --no-keep-extracted \
            --allow-damaged \
            --progress lines
          
          kill $WATCHER_PID $WATCHER2_PID 2>/dev/null || true
          ls -lh "$OUT_IPA"

      - name: 6. Derlenen Shader ve Modülleri Önbelleğe (Cache) Kaydet (Hata Olsa Bile Kaydeder!)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /Users/runner/work/_temp/Games/TotK/0100F2C0115B6000_build/patched_*
            /Users/runner/work/_temp/Games/TotK/0100F2C0115B6000_build/shader
            /Users/runner/work/_temp/Games/TotK/0100F2C0115B6000_build/font
            nxnative/dm/games/0100F2C0115B6000/c1_full.tsv
            nxnative/dm/games/0100F2C0115B6000/cb_extent.tsv
          key: totk-shaders-v2-${{ inputs.base_gdrive_id }}-${{ inputs.update_gdrive_id }}-${{ github.run_id }}

      - name: 7. IPA'yı 1.9 GB Parçalara Böl ve GitHub Releases'a Yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/Games/TotK" "$RUNNER_TEMP/keys"
          cd "$RUNNER_TEMP/out"
          echo "GitHub 2 GB Release limitine takılmamak için 1900 MB parçalara bölünüyor (sıkıştırmasız hızlı bölme)..."
          7z a -v1900m -mx0 TotK_IPA.7z TotK.ipa
          rm -f TotK.ipa
          ls -lh
          
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" TotK_IPA.7z.* \
            --repo "${{ github.repository }}" \
            --title "Tears of the Kingdom IPA (#${{ github.run_number }})" \
            --notes "İndirdikten sonra tüm parçaları (TotK_IPA.7z.001, .002...) aynı klasöre koyup 7-Zip ile 001 dosyasına sağ tıklayarak çıkartın ve hemen ardından bu Release'i silin."
