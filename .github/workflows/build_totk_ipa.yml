name: Build Zelda TotK IPA

on:
  workflow_dispatch:
    inputs:
      base_gdrive_id:
        description: 'Base Game (.xci veya .nsp) Google Drive Link veya ID'
        required: true
        type: string
      update_gdrive_id:
        description: 'Update (.nsp) Google Drive Link veya ID'
        required: true
        type: string
      keys_gdrive_id:
        description: 'prod.keys Google Drive Link veya ID'
        required: true
        type: string
      language:
        description: 'Game Language (e.g. en-US, ja, fr, de, es)'
        required: false
        default: 'en-US'
        type: string

permissions:
  contents: write

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: 1. Disk Alanı Aç (Eski Xcode ve Gereksiz Araçları Sil - ~65 GB Kazanım)
        run: |
          echo "=== Temizlik Öncesi Disk Durumu ==="
          df -h
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          echo "Aktif Xcode korunuyor: $ACTIVE_XCODE"
          for x in /Applications/Xcode*.app; do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              echo "Siliniyor: $x"
              sudo rm -rf "$x" || true
            fi
          done
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes || true
          sudo rm -rf /Users/runner/.dotnet || true
          sudo rm -rf /usr/local/share/dotnet || true
          brew cleanup -s || true
          echo "=== Temizlik Sonrası Disk Durumu ==="
          df -h

      - name: 2. nxnative Kaynak Kodunu İndir ve Tüm Bağımlılıkları Eksiksiz Kur
        run: |
          git clone https://github.com/seedds/nxnative.git
          
          echo "=== Homebrew Paketleri Kuruluyor ==="
          brew install xcodegen zstd spirv-cross glslang lz4 p7zip
          
          echo "=== .NET 10 SDK Kontrol Ediliyor / Kuruluyor ==="
          if ! dotnet --list-sdks 2>/dev/null | grep -q "^10\."; then
            brew install --cask dotnet-sdk || brew upgrade --cask dotnet-sdk
          fi
          dotnet --info
          
          echo "=== Metal Derleyicisi Kontrol Ediliyor ==="
          if ! xcrun -f metal >/dev/null 2>&1; then
            echo "Metal Toolchain indiriliyor..."
            xcodebuild -downloadComponent MetalToolchain || xcodebuild -downloadComponent metalToolchain || true
          fi
          xcrun -f metal || true
          
          echo "=== Python Paketleri ve C-Eklentili LZ4 Kuruluyor ==="
          python3 -m pip install --break-system-packages gdown capstone fonttools "backports.zstd; python_version < '3.14'"
          PYLZ4_USE_SYSTEM_LZ4=0 python3 -m pip install --break-system-packages --force-reinstall --no-binary lz4 lz4
          python3 -c "import lz4.block, capstone, fontTools, gdown; print('Tüm Python modülleri sorunsuz yüklendi!')"

      - name: 3. Oyun Dosyalarını (.xci + .nsp) ve prod.keys Dosyasını Google Drive'dan İndir
        env:
          IN_KEYS: ${{ inputs.keys_gdrive_id }}
          IN_BASE: ${{ inputs.base_gdrive_id }}
          IN_UPD: ${{ inputs.update_gdrive_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/Games/TotK"
          mkdir -p "$RUNNER_TEMP/keys"
          
          python3 - << 'EOF'
          import os, re, sys, zipfile
          import gdown

          def extract_id(val):
              val = val.strip()
              m = re.search(r'/d/([a-zA-Z0-9_-]{15,})', val)
              if m:
                  return m.group(1)
              m = re.search(r'[?&]id=([a-zA-Z0-9_-]{15,})', val)
              if m:
                  return m.group(1)
              return val

          def smart_download(raw_input, out_path, min_bytes, label):
              fid = extract_id(raw_input)
              print(f"=== {label} indiriliyor (ID: {fid}) ===", flush=True)
              try:
                  res = gdown.download(id=fid, output=out_path, quiet=False, fuzzy=True)
              except TypeError:
                  url = f"https://drive.google.com/uc?id={fid}"
                  res = gdown.download(url=url, output=out_path, quiet=False)
              if not res or not os.path.exists(out_path):
                  sys.exit(f"HATA: {label} indirilemedi! Lütfen Google Drive paylaşım izninin 'Bağlantıya sahip olan herkes' (Anyone with the link) olduğundan emin olun.")
              sz = os.path.getsize(out_path)
              print(f"{label} indirildi: {sz / (1024*1024):.2f} MB", flush=True)
              if sz < min_bytes:
                  with open(out_path, 'rb') as f:
                      head = f.read(512)
                  if b'<html' in head.lower() or b'<!doctype' in head.lower():
                      sys.exit(f"HATA: {label} yerine Google Drive HTML uyarı sayfası indi! Dosya izinlerini veya indirme kotasını kontrol edin.")
                  sys.exit(f"HATA: {label} boyutu beklenenden çok küçük ({sz} byte)!")

          temp_dir = os.environ["RUNNER_TEMP"]
          keys_out = os.path.join(temp_dir, "keys", "prod.keys")
          smart_download(os.environ["IN_KEYS"], keys_out, 500, "prod.keys")

          # Eğer prod.keys bir ZIP arşivi olarak yüklenmişse otomatik içinden çıkar
          if zipfile.is_zipfile(keys_out):
              print("Uyarı: prod.keys bir ZIP dosyası olarak algılandı, içinden çıkarılıyor...", flush=True)
              with zipfile.ZipFile(keys_out, 'r') as z:
                  extracted = False
                  for name in z.namelist():
                      if name.endswith(".keys") or "prod" in name.lower():
                          data = z.read(name)
                          with open(keys_out, "wb") as f:
                              f.write(data)
                          extracted = True
                          print(f"ZIP içinden '{name}' başarıyla prod.keys olarak çıkarıldı!", flush=True)
                          break
                  if not extracted:
                      sys.exit("HATA: prod.keys ZIP arşivinin içinde .keys dosyası bulunamadı!")

          # Tears of the Kingdom profilindeki gerçek sürüm etiketini game.tsv'den oku
          upd_ver = "v393216"
          game_tsv = "nxnative/dm/games/0100F2C0115B6000/game.tsv"
          if os.path.exists(game_tsv):
              with open(game_tsv, "r", encoding="utf-8") as f:
                  for line in f:
                      m = re.search(r'\b(v[1-9][0-9]*)\b', line)
                      if m:
                          upd_ver = m.group(1)
          print(f"Algılanan hedef Update sürüm etiketi: {upd_ver}", flush=True)
          with open(os.path.join(temp_dir, "upd_ver.txt"), "w") as f:
              f.write(upd_ver)

          base_out = os.path.join(temp_dir, "Games", "TotK", "Tears of the Kingdom [0100F2C0115B6000][v0].xci")
          upd_out = os.path.join(temp_dir, "Games", "TotK", f"Tears of the Kingdom [0100F2C0115B6800][{upd_ver}].nsp")

          smart_download(os.environ["IN_BASE"], base_out, 100 * 1024 * 1024, "Base Game (.xci)")
          smart_download(os.environ["IN_UPD"], upd_out, 10 * 1024 * 1024, "Update (.nsp)")
          EOF
          
          ls -lh "$RUNNER_TEMP/Games/TotK" "$RUNNER_TEMP/keys/prod.keys"
          df -h

      - name: 4. Dosyaları Çıkar, Kodları ve Shader'ları Derle, IPA Paketle (Akıllı Disk Temizlemeli)
        working-directory: nxnative
        run: |
          set -e
          G=0100F2C0115B6000
          NSP_DIR="$RUNNER_TEMP/Games/TotK"
          KEYS="$RUNNER_TEMP/keys/prod.keys"
          OUT_IPA="$RUNNER_TEMP/out/TotK.ipa"
          mkdir -p "$RUNNER_TEMP/out"
          
          echo "=== Tears of the Kingdom Profil Bilgisi ==="
          cat "dm/games/$G/game.tsv" || true
          
          # Arka planda çalışan otomatik disk koruyucu:
          # build_ipa_from_nsp.py ekstraksiyonu bitirip "patch_nso" (modül yeniden yazma) veya "shader" aşamasına geçtiği an,
          # kaynak .xci ve .nsp dosyalarını otomatik silerek ~18 GB disk alanını anında serbest bırakır!
          (
            while true; do
              if ls "$NSP_DIR/${G}_build"/patched_* >/dev/null 2>&1 || ls "$NSP_DIR/${G}_build"/shader/* >/dev/null 2>&1; then
                echo "[Disk Koruyucu] Ekstraksiyon tamamlandı! Kaynak .xci ve .nsp dosyaları siliniyor (~18 GB yer açılıyor)..."
                rm -f "$NSP_DIR"/*.xci "$NSP_DIR"/*.nsp
                df -h
                break
              fi
              sleep 5
            done
          ) &
          WATCHER_PID=$!
          
          # Ayrıca iOS shader derlemesi bittiğinde ve Xcode paketlemesine geçildiğinde v0 RomFS fazlalığını temizle
          (
            while true; do
              if ls -d "$NSP_DIR/${G}_build"/ipa/build* >/dev/null 2>&1; then
                echo "[Disk Koruyucu] Shader aşaması bitti, Xcode IPA paketlemesine geçildi! v0 RomFS siliniyor..."
                rm -rf "$NSP_DIR/${G}_build/extract/v0" || true
                df -h
                break
              fi
              sleep 5
            done
          ) &
          WATCHER2_PID=$!
          
          echo "=== Resmi build_ipa_from_nsp.py Başlatılıyor ==="
          python3 scripts/build_ipa_from_nsp.py "$NSP_DIR" \
            -k "$KEYS" \
            -o "$OUT_IPA" \
            -l "${{ inputs.language }}" \
            --show-fps \
            --no-keep-extracted \
            --allow-damaged \
            --progress lines
          
          kill $WATCHER_PID $WATCHER2_PID 2>/dev/null || true
          
          echo "=== Geçici Derleme Klasörleri Temizleniyor ==="
          rm -rf "$NSP_DIR" "$RUNNER_TEMP/keys"
          ls -lh "$OUT_IPA"
          df -h

      - name: 5. IPA'yı 1.9 GB Parçalara Böl ve GitHub Releases'a Yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          echo "GitHub 2 GB Release limitine takılmamak için 1900 MB parçalara bölünüyor (sıkıştırmasız hızlı bölme)..."
          7z a -v1900m -mx0 TotK_IPA.7z TotK.ipa
          rm -f TotK.ipa
          ls -lh
          
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" TotK_IPA.7z.* \
            --repo "${{ github.repository }}" \
            --title "Tears of the Kingdom IPA (#${{ github.run_number }})" \
            --notes "İndirdikten sonra tüm parçaları (TotK_IPA.7z.001, .002...) aynı klasöre koyup 7-Zip ile 001 dosyasına sağ tıklayarak çıkartın ve hemen ardından bu Release'i silin."
